<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Локальный Интерком</title>

  <!-- PWA настройки -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#121212">

  <!-- PeerJS для мгновенного P2P соединения -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

  <style>
    :root {
      --bg: #121212;
      --surface: #1e1e1e;
      --surface-light: #2c2c2e;
      --border: rgba(255, 255, 255, 0.08);
      --text: #f5f5f7;
      --text-muted: #8e8e93;
      --accent-green: #30d158;
      --accent-red: #ff453a;
      --accent-blue: #0a84ff;
      --accent-yellow: #ffd60a;
      --radius-lg: 20px;
      --radius-md: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .screen {
      display: none;
      flex-direction: column;
      height: 100%;
      padding: 16px;
      max-width: 440px;
      margin: 0 auto;
      width: 100%;
    }

    .screen.active {
      display: flex;
    }

    .card {
      background: var(--surface);
      border-radius: var(--radius-lg);
      padding: 18px;
      border: 1px solid var(--border);
      margin-bottom: 12px;
    }

    .card-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      margin-bottom: 10px;
      font-weight: 700;
    }

    /* Крупное поле ввода номера комнаты */
    .room-input {
      width: 100%;
      background: var(--surface-light);
      border: 2px solid transparent;
      outline: none;
      padding: 18px;
      border-radius: var(--radius-md);
      color: #fff;
      font-size: 26px;
      font-weight: 800;
      text-align: center;
      letter-spacing: 4px;
      margin-bottom: 14px;
      user-select: text;
    }

    .room-input:focus {
      border-color: var(--accent-blue);
    }

    .btn {
      width: 100%;
      padding: 16px;
      border-radius: var(--radius-md);
      font-size: 16px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.1s, opacity 0.2s;
    }

    .btn:active {
      transform: scale(0.98);
      opacity: 0.9;
    }

    .btn-create { background: var(--accent-green); color: #000; margin-bottom: 10px; }
    .btn-join { background: var(--accent-blue); color: #fff; }
    .btn-hangup { background: var(--accent-red); color: #fff; width: auto; padding: 8px 16px; font-size: 13px; }

    /* Статус соединения */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 40px;
      background: var(--surface);
      font-size: 13px;
      font-weight: 600;
      border: 1px solid var(--border);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-muted);
    }

    .status-dot.connected { background: var(--accent-green); box-shadow: 0 0 10px var(--accent-green); }
    .status-dot.waiting { background: var(--accent-yellow); animation: pulse 1.2s infinite; }
    .status-dot.error { background: var(--accent-red); }

    @keyframes pulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    /* Большая кнопка микрофона */
    .mic-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 16px 0;
    }

    .btn-mic {
      width: 135px;
      height: 135px;
      border-radius: 50%;
      border: none;
      outline: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.08s ease-out;
    }

    .btn-mic.active {
      background: radial-gradient(circle, #203a27 0%, #152219 100%);
      border: 3px solid var(--accent-green);
      color: var(--accent-green);
      box-shadow: 0 0 25px rgba(48, 209, 88, 0.3);
    }

    .btn-mic.muted {
      background: radial-gradient(circle, #381e1e 0%, #201313 100%);
      border: 3px solid var(--accent-red);
      color: var(--accent-red);
      box-shadow: 0 0 25px rgba(255, 69, 58, 0.25);
    }

    .btn-mic svg {
      width: 50px;
      height: 50px;
      fill: currentColor;
    }

    .mic-label {
      margin-top: 10px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    /* Селекторы устройств ввода/вывода */
    .audio-select {
      width: 100%;
      background: var(--surface-light);
      border: 1px solid var(--border);
      padding: 10px 12px;
      border-radius: var(--radius-md);
      color: var(--text);
      font-size: 13px;
      margin-bottom: 8px;
      outline: none;
    }

    /* Сессионный чат */
    .chat-card {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--surface);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      padding: 12px;
      min-height: 110px;
      margin-top: 6px;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 8px;
      user-select: text;
    }

    .msg {
      max-width: 85%;
      padding: 8px 12px;
      border-radius: var(--radius-md);
      font-size: 14px;
      word-break: break-word;
    }

    .msg.me { align-self: flex-end; background: var(--accent-blue); color: #fff; }
    .msg.remote { align-self: flex-start; background: var(--surface-light); }

    .chat-input-row {
      display: flex;
      gap: 6px;
    }

    .chat-input {
      flex: 1;
      background: var(--surface-light);
      border: none;
      outline: none;
      padding: 12px 14px;
      border-radius: var(--radius-md);
      color: #fff;
      font-size: 14px;
      user-select: text;
    }

    .btn-send {
      background: var(--accent-blue);
      border: none;
      width: 44px;
      height: 44px;
      border-radius: var(--radius-md);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Аудио воспроизведения собеседника -->
  <audio id="remoteAudio" autoplay playsinline></audio>

  <!-- ================= ЭКРАН 1: ВХОД В КОМНАТУ ================= -->
  <div id="screenConnect" class="screen active">
    <div style="text-align: center; margin: 24px 0 16px 0;">
      <h1 style="font-size: 22px; font-weight: 800; letter-spacing: -0.5px;">Локальный Интерком</h1>
      <p style="font-size: 13px; color: var(--text-muted); margin-top: 4px;">Прямая голосовая связь по точке доступа</p>
    </div>

    <div class="card">
      <div class="card-title">Номер комнаты</div>
      <input type="text" id="roomInput" class="room-input" placeholder="777" maxlength="6" autocomplete="off" spellcheck="false">
      
      <button class="btn btn-create" id="btnCreate">📡 Создать комнату</button>
      <button class="btn btn-join" id="btnJoin">🔗 Подключиться</button>
    </div>

    <div style="text-align: center; margin-top: auto; padding-bottom: 12px;">
      <div class="status-badge">
        <div class="status-dot waiting" id="homeStatusDot"></div>
        <span id="homeStatusText">Введите номер комнаты</span>
      </div>
    </div>
  </div>

  <!-- ================= ЭКРАН 2: АКТИВНЫЙ РАЗГОВОР ================= -->
  <div id="screenTalk" class="screen">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <div class="status-badge">
        <div class="status-dot connected"></div>
        <span id="roomBadgeText">Комната</span>
      </div>
      <button class="btn btn-hangup" id="btnDisconnect">Выйти</button>
    </div>

    <!-- Кнопка микрофона с динамическим индикатором звука -->
    <div class="mic-container">
      <button class="btn-mic active" id="btnMic">
        <svg viewBox="0 0 24 24">
          <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
          <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
        </svg>
      </button>
      <div class="mic-label" id="micLabel" style="color: var(--accent-green);">МИКРОФОН ВКЛ</div>
    </div>

    <!-- Выбор микрофона и динамика -->
    <div style="background: var(--surface); padding: 10px 12px; border-radius: var(--radius-md); border: 1px solid var(--border);">
      <div style="font-size: 11px; color: var(--text-muted); font-weight: 700; margin-bottom: 2px;">МИКРОФОН (ВХОД)</div>
      <select class="audio-select" id="micSelect"></select>

      <div style="font-size: 11px; color: var(--text-muted); font-weight: 700; margin-bottom: 2px;">ДИНАМИК (ВЫХОД)</div>
      <select class="audio-select" id="speakerSelect"></select>
    </div>

    <!-- Чат внутри сессии -->
    <div class="chat-card">
      <div class="chat-messages" id="chatBox"></div>
      <div class="chat-input-row">
        <input type="text" id="chatInput" class="chat-input" placeholder="Сообщение..." autocomplete="off">
        <button class="btn-send" id="btnSend">➔</button>
      </div>
    </div>
  </div>

  <script>
    // --- ПЕРЕМЕННЫЕ СОСТОЯНИЯ ---
    let peer = null;
    let localStream = null;
    let activeCall = null;
    let activeConn = null;
    let isMuted = false;
    let currentRoom = '';

    let selectedMicId = '';
    let selectedSpeakerId = '';

    // VU-метр (индикатор голоса)
    let audioCtx = null;
    let analyser = null;
    let vuData = null;

    // Префикс исключает глобальные коллизии на публичном брокере
    const PREFIX = 'local_walkie_v3_';

    // DOM элементы
    const screenConnect = document.getElementById('screenConnect');
    const screenTalk = document.getElementById('screenTalk');
    const roomInput = document.getElementById('roomInput');
    const btnCreate = document.getElementById('btnCreate');
    const btnJoin = document.getElementById('btnJoin');
    const btnDisconnect = document.getElementById('btnDisconnect');
    const homeStatusText = document.getElementById('homeStatusText');
    const homeStatusDot = document.getElementById('homeStatusDot');
    const roomBadgeText = document.getElementById('roomBadgeText');

    const btnMic = document.getElementById('btnMic');
    const micLabel = document.getElementById('micLabel');
    const micSelect = document.getElementById('micSelect');
    const speakerSelect = document.getElementById('speakerSelect');
    const remoteAudio = document.getElementById('remoteAudio');

    const chatBox = document.getElementById('chatBox');
    const chatInput = document.getElementById('chatInput');
    const btnSend = document.getElementById('btnSend');

    // Разблокировка мобильного аудио при первом клике/касании
    function unlockAudio() {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) {
        const ctx = new AudioCtx();
        if (ctx.state === 'suspended') ctx.resume();
      }
      remoteAudio.play().catch(() => {});
    }
    document.addEventListener('touchstart', unlockAudio, { once: true });
    document.addEventListener('click', unlockAudio, { once: true });

    // --- ПОЛУЧЕНИЕ АУДИО С ПОДАВЛЕНИЕМ ШУМА И ЭХА ---
    async function getAudio() {
      if (localStream) return localStream;

      const constraints = {
        video: false,
        audio: {
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true,
          latency: 0
        }
      };
      if (selectedMicId) {
        constraints.audio.deviceId = { exact: selectedMicId };
      }

      try {
        localStream = await navigator.mediaDevices.getUserMedia(constraints);
        initVU(localStream);
        await refreshDevices();
        return localStream;
      } catch (err) {
        alert('Ошибка микрофона: ' + err.message + '\nУбедитесь, что страница открыта по HTTPS или на localhost');
        throw err;
      }
    }

    // Индикатор громкости на кнопке микрофона
    function initVU(stream) {
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const src = audioCtx.createMediaStreamSource(stream);
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 64;
        src.connect(analyser);
        vuData = new Uint8Array(analyser.frequencyBinCount);

        function drawVU() {
          if (!analyser || isMuted) {
            btnMic.style.transform = 'scale(1)';
            requestAnimationFrame(drawVU);
            return;
          }
          analyser.getByteFrequencyData(vuData);
          let sum = 0;
          for (let i = 0; i < vuData.length; i++) sum += vuData[i];
          const avg = sum / vuData.length;
          const scale = 1 + (avg / 255) * 0.15;
          btnMic.style.transform = `scale(${scale})`;
          requestAnimationFrame(drawVU);
        }
        drawVU();
      } catch (e) {}
    }

    // --- УСТРОЙСТВА ВВОДА / ВЫВОДА ---
    async function refreshDevices() {
      if (!navigator.mediaDevices?.enumerateDevices) return;
      const devices = await navigator.mediaDevices.enumerateDevices();

      // Микрофоны
      micSelect.innerHTML = '';
      devices.filter(d => d.kind === 'audioinput').forEach((d, i) => {
        const o = document.createElement('option');
        o.value = d.deviceId;
        o.text = d.label || `Микрофон ${i + 1}`;
        if (d.deviceId === selectedMicId) o.selected = true;
        micSelect.appendChild(o);
      });

      // Динамики
      speakerSelect.innerHTML = '';
      if ('setSinkId' in HTMLMediaElement.prototype) {
        devices.filter(d => d.kind === 'audiooutput').forEach((d, i) => {
          const o = document.createElement('option');
          o.value = d.deviceId;
          o.text = d.label || `Динамик ${i + 1}`;
          if (d.deviceId === selectedSpeakerId) o.selected = true;
          speakerSelect.appendChild(o);
        });
      } else {
        const o = document.createElement('option');
        o.text = 'Вывод управляется системой (iOS)';
        speakerSelect.appendChild(o);
        speakerSelect.disabled = true;
      }
    }

    micSelect.onchange = async () => {
      selectedMicId = micSelect.value;
      if (localStream) {
        localStream.getTracks().forEach(t => t.stop());
        localStream = null;
        const newStream = await getAudio();
        const newTrack = newStream.getAudioTracks()[0];
        newTrack.enabled = !isMuted;
        if (activeCall && activeCall.peerConnection) {
          const sender = activeCall.peerConnection.getSenders().find(s => s.track?.kind === 'audio');
          if (sender) sender.replaceTrack(newTrack);
        }
      }
    };

    speakerSelect.onchange = async () => {
      selectedSpeakerId = speakerSelect.value;
      if ('setSinkId' in remoteAudio && selectedSpeakerId) {
        await remoteAudio.setSinkId(selectedSpeakerId);
      }
    };

    // Общая конфигурация WebRTC со STUN Google для мгновенного нахождения локального IP
    const peerConfig = {
      debug: 1,
      config: {
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' }
        ]
      }
    };

    // --- 1. СОЗДАТЬ КОМНАТУ (ХОСТ) ---
    btnCreate.onclick = async () => {
      const roomNum = roomInput.value.trim();
      if (!roomNum) return alert('Введите номер комнаты (например: 55)');
      currentRoom = roomNum;

      setStatus('Инициализация микрофона...', 'waiting');
      const stream = await getAudio();

      if (peer) peer.destroy();
      const hostId = PREFIX + roomNum;
      peer = new Peer(hostId, peerConfig);

      peer.on('open', () => {
        setStatus(`Комната ${roomNum} открыта! Ждем собеседника...`, 'waiting');
        btnCreate.disabled = true;
        btnJoin.disabled = true;
      });

      // Автоматический прием входящего звонка без каких-либо подтверждений!
      peer.on('call', (call) => {
        call.answer(stream);
        setupCall(call);
        openTalkScreen();
      });

      peer.on('connection', (conn) => {
        setupConn(conn);
      });

      peer.on('error', (err) => {
        if (err.type === 'unavailable-id') {
          setStatus(`Комната ${roomNum} уже кем-то открыта. Нажмите «Подключиться»`, 'error');
        } else {
          setStatus('Ошибка: ' + err.type, 'error');
        }
        btnCreate.disabled = false;
        btnJoin.disabled = false;
      });
    };

    // --- 2. ПОДКЛЮЧИТЬСЯ (КЛИЕНТ) ---
    btnJoin.onclick = async () => {
      const roomNum = roomInput.value.trim();
      if (!roomNum) return alert('Введите номер комнаты (например: 55)');
      currentRoom = roomNum;

      setStatus('Подключение к комнате ' + roomNum + '...', 'waiting');
      const stream = await getAudio();

      if (peer) peer.destroy();
      // Клиент получает случайный ID и сразу звонит создателю
      peer = new Peer(peerConfig);

      peer.on('open', () => {
        const hostId = PREFIX + roomNum;

        // Звоним создателю
        const call = peer.call(hostId, stream);
        setupCall(call);

        // Открываем канал чата
        const conn = peer.connect(hostId);
        setupConn(conn);
      });

      peer.on('error', (err) => {
        if (err.type === 'peer-unavailable') {
          setStatus(`Комната ${roomNum} не найдена. Создатель должен сначала нажать «Создать комнату»`, 'error');
        } else {
          setStatus('Ошибка сети: ' + err.type, 'error');
        }
      });
    };

    // --- ОБРАБОТЧИКИ МЕДИА И ЧАТА ---
    function setupCall(call) {
      activeCall = call;

      call.on('stream', (remoteStream) => {
        remoteAudio.srcObject = remoteStream;
        remoteAudio.play().catch(() => {});
        openTalkScreen();
      });

      call.on('close', disconnect);
      call.on('error', disconnect);
    }

    function setupConn(conn) {
      activeConn = conn;
      conn.on('data', (text) => addMsg('remote', text));
      conn.on('close', disconnect);
    }

    // --- ЧАТ ---
    btnSend.onclick = sendChat;
    chatInput.onkeydown = (e) => { if (e.key === 'Enter') sendChat(); };

    function sendChat() {
      const text = chatInput.value.trim();
      if (!text || !activeConn) return;
      activeConn.send(text);
      addMsg('me', text);
      chatInput.value = '';
    }

    function addMsg(sender, text) {
      const d = document.createElement('div');
      d.className = `msg ${sender}`;
      d.textContent = text;
      chatBox.appendChild(d);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    // --- MUTE МИКРОФОНА ---
    btnMic.onclick = () => {
      isMuted = !isMuted;
      if (localStream) {
        localStream.getAudioTracks().forEach(t => t.enabled = !isMuted);
      }
      if (isMuted) {
        btnMic.className = 'btn-mic muted';
        micLabel.textContent = 'МИКРОФОН ВЫКЛ';
        micLabel.style.color = 'var(--accent-red)';
      } else {
        btnMic.className = 'btn-mic active';
        micLabel.textContent = 'МИКРОФОН ВКЛ';
        micLabel.style.color = 'var(--accent-green)';
      }
      if (navigator.vibrate) navigator.vibrate(35);
    };

    // --- НАВИГАЦИЯ И СОСТОЯНИЯ ---
    function openTalkScreen() {
      screenConnect.classList.remove('active');
      screenTalk.classList.add('active');
      roomBadgeText.textContent = `Комната ${currentRoom}`;
    }

    function setStatus(text, type) {
      homeStatusText.textContent = text;
      homeStatusDot.className = 'status-dot ' + type;
    }

    function disconnect() {
      if (activeCall) { activeCall.close(); activeCall = null; }
      if (activeConn) { activeConn.close(); activeConn = null; }
      if (peer) { peer.destroy(); peer = null; }
      if (localStream) {
        localStream.getTracks().forEach(t => t.stop());
        localStream = null;
      }

      btnCreate.disabled = false;
      btnJoin.disabled = false;
      chatBox.innerHTML = '';
      screenTalk.classList.remove('active');
      screenConnect.classList.add('active');
      setStatus('Введите номер комнаты', 'waiting');
    }

    btnDisconnect.onclick = disconnect;
  </script>
</body>
</html>
